name: Checkstyle and run tests
on:
  push:
    branches:
      - "**"
jobs:
  checkstyle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
      - name: checkstyle
        run: ./gradlew spotlessCheck
  tests:
    runs-on: ubuntu-latest
    needs: checkstyle
    steps:
      - uses: actions/checkout@v5
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
      - name: Run test
        run: ./gradlew clean test --info --stacktrace
      - name: Test Summary
        uses: test-summary/action@v2
        with:
          paths: | 
            **/build/test-results/test/TEST-*.xml
            build/test-results/test/TEST-*.xml
        if: always() # Важно: чтобы отчёт появился, даже если тесты упали